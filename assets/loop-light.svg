<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-labelledby="title" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Agent loop: brief, worker, hooks, gate, review, merge, prod check</title>
<rect width="840" height="320" rx="16" fill="#f5f7fb"/>
<ellipse cx="420" cy="160" rx="300" ry="105" fill="none" stroke="#4b5a70" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="420.0" cy="55.0" r="9" fill="#c07f1a" stroke="#f5f7fb" stroke-width="3"/>
<text x="438.0" y="61.0" font-size="22" font-weight="700" text-anchor="start" fill="#1f3760">brief</text>
<circle cx="654.5" cy="94.5" r="9" fill="#c07f1a" stroke="#f5f7fb" stroke-width="3"/>
<text x="672.5" y="100.5" font-size="22" font-weight="700" text-anchor="start" fill="#1f3760">worker</text>
<circle cx="712.5" cy="183.4" r="9" fill="#c07f1a" stroke="#f5f7fb" stroke-width="3"/>
<text x="730.5" y="189.4" font-size="22" font-weight="700" text-anchor="start" fill="#1f3760">hooks</text>
<circle cx="550.2" cy="254.6" r="9" fill="#c07f1a" stroke="#f5f7fb" stroke-width="3"/>
<text x="568.2" y="260.6" font-size="22" font-weight="700" text-anchor="start" fill="#1f3760">gate</text>
<circle cx="289.8" cy="254.6" r="9" fill="#c07f1a" stroke="#f5f7fb" stroke-width="3"/>
